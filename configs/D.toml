"$schema" = 'https://starship.rs/config-schema.json'

# Style D; switch styles with activate.sh. Language icons and major/minor versions share one section; Kubernetes enabled.
add_newline = false
# Allow brief runtime startup delays (for example, `node --version` on a busy machine).
command_timeout = 2000
scan_timeout = 25
# Palettes: mocha, ocean, nord, daybreak, halloween, thanksgiving, christmas, new_year, original_blue, dracula, dracula_dark, aurora, solar_flare, velvet_gold, obsidian
palette = 'dracula_dark'
format = '[](fg:os_bg)$os$directory$git_branch$git_status$git_state([╱](fg:language_fg bg:language_bg)$java$kotlin$gradle${custom.groovy}${custom.maven}$scala$rust$python$nodejs$deno$bun${custom.javascript}${custom.typescript}${custom.react}${custom.vue}${custom.svelte}${custom.html}${custom.css}${custom.shell}$golang$c$cpp$cmake$swift$dart${custom.flutter}$php$ruby$lua$zig$elixir$erlang$haskell$ocaml$perl$rlang$nim$crystal$dotnet)$docker_context$kubernetes$terraform$aws$gcloud$azure$direnv$cmd_duration[](fg:prev_bg) $character'


[os]
disabled = false
format = '[ $symbol ](fg:os_fg bg:os_bg)'

# Icons only: no OS name or version in the prompt.
[os.symbols]
Macos = ''
Linux = '󰌽'
Windows = '󰍲'
Ubuntu = '󰕈'
Debian = ''
Arch = '󰣇'
Fedora = '󰣛'
Alpine = ''
Android = ''
CentOS = ''
FreeBSD = ''
Gentoo = '󰣨'
Kali = ''
Manjaro = ''
Mint = '󰣭'
NixOS = ''
OpenBSD = ''
openSUSE = ''
Pop = ''
Raspbian = ''
Redhat = '󱄛'
SUSE = ''
Unknown = '󰀄'

[directory]
format = '[╱](fg:path_fg bg:path_bg)[  $path$read_only ](fg:path_fg bg:path_bg)'
style = 'fg:path_fg bg:path_bg'
read_only = ' '
read_only_style = 'fg:path_fg bg:path_bg'
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = ' '
format = '[╱](fg:git_fg bg:git_bg)[ $symbol$branch ](fg:git_fg bg:git_bg)'
style = 'fg:git_fg bg:git_bg'

[git_status]
format = '([$all_status$ahead_behind](fg:status_fg bg:git_bg))'
style = 'fg:status_fg bg:git_bg'
conflicted = '󰞇${count} '
ahead = '⇡${count} '
behind = '⇣${count} '
diverged = '⇕⇡${ahead_count}⇣${behind_count} '
untracked = '?${count} '
stashed = '≡${count} '
modified = '●${count} '
staged = '+${count} '
renamed = '»${count} '
deleted = '✘${count} '

typechanged = '~${count} '
[git_state]
format = '[ $state( $progress_current/$progress_total) ](fg:git_fg bg:git_bg)'
style = 'fg:git_fg bg:git_bg'

[fill]
symbol = ' '

[cmd_duration]
min_time = 1000
format = '[╱](fg:duration_fg bg:duration_bg)[ 󰔛 $duration ](fg:duration_fg bg:duration_bg)'
style = 'fg:duration_fg bg:duration_bg'

[time]
disabled = false
time_format = '%H:%M'
format = '[ $time]($style)'
style = 'muted_fg'

[character]
success_symbol = '[❯](bold fg:success_fg)'
error_symbol = '[❯](bold fg:error_fg)'
vimcmd_symbol = '[❮](bold fg:mode_fg)'

# Language indicators: shown only when Starship detects a matching project.
[java]
symbol = ' '
format = '[ $symbol($version )](fg:language_fg bg:language_bg)'
style = 'fg:language_fg bg:language_bg'
version_format = '${major}(.${minor})'

[kotlin]
symbol = ' '
format = '[ $symbol($version )](fg:language_fg bg:language_bg)'
style = 'fg:language_fg bg:language_bg'
version_format = '${major}(.${minor})'

