# Custom modules must be referenced as ${custom.name} in format.
# Detection is based on matching files; do not add an unconditional 'when'.
version_format = '${major}(.${minor})'

[custom.groovy]
detect_extensions = ['groovy', 'gvy']
detect_files = ['Jenkinsfile']
format = '[ $symbol](fg:language_fg bg:language_bg)'
style = 'fg:language_fg bg:language_bg'
symbol = ' '

[custom.maven]
detect_files = ['pom.xml']
